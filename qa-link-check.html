<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QA Link Check</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101418; color: #fff; }
    header { padding: 18px 16px; background: #1d2730; border-bottom: 1px solid #31404d; }
    h1 { margin: 0 0 6px; font-size: 20px; }
    p { margin: 0; color: #b8c4cf; font-size: 13px; }
    main { padding: 14px; display: grid; gap: 10px; }
    a, button { display: block; width: 100%; box-sizing: border-box; min-height: 46px; border: 0; border-radius: 8px; padding: 13px 12px; background: #2f80ed; color: #fff; font-size: 15px; font-weight: 700; text-align: center; text-decoration: none; }
    button.secondary, a.secondary { background: #59636d; }
    button.warn, a.warn { background: #bd6b08; }
    button.danger, a.danger { background: #a4343a; }
    #frameTarget { min-height: 80px; border: 1px dashed #51606d; border-radius: 8px; padding: 10px; color: #b8c4cf; }
    pre { white-space: pre-wrap; word-break: break-word; background: #050708; border: 1px solid #31404d; border-radius: 8px; padding: 10px; min-height: 120px; color: #9ef29e; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>QA Link Check</h1>
    <p>用於驗證 WebView link interception。</p>
  </header>
  <main>
    <a href="https://example.com">External https://example.com</a>
    <a class="warn" href="https://demo.example.com/loading">Demo /loading → Outside WebView</a>
    <a class="warn" href="https://demo.example.com/service">Demo /service → Outside WebView</a>
    <a class="secondary" href="https://demo.example.com/profile">Demo normal path → Main WebView</a>
    <a class="warn" href="https://fatcat.example.com/loading">FatCat /loading → Outside WebView</a>
    <a class="warn" href="https://fatcat.example.com/service">FatCat /service → Outside WebView</a>
    <a class="secondary" href="https://fatcat.example.com/profile">FatCat normal path → Main WebView</a>
    <button class="danger" onclick="goAboutBlank()">about:blank</button>
    <button class="secondary" onclick="appendIframe()">Append iframe external URL</button>
    <div id="frameTarget">iframe target</div>
    <pre id="log"></pre>
  </main>
  <script>
    const logEl = document.getElementById('log');
    function log(message) {
      logEl.textContent = `[${new Date().toLocaleTimeString()}] ${message}\n${logEl.textContent}`;
    }
    function goAboutBlank() {
      log('navigate to about:blank');
      location.href = 'about:blank';
    }
    function appendIframe() {
      log('append iframe https://example.com');
      const iframe = document.createElement('iframe');
      iframe.src = 'https://example.com';
      iframe.width = '100%';
      iframe.height = '120';
      document.getElementById('frameTarget').appendChild(iframe);
    }
  </script>
</body>
</html>
