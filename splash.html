<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="
        width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover
      "
    />

    <title>My Web App</title>

    <meta
      name="description"
      content="iOS Web Clip 自訂啟動畫面完整範例"
    />

    <!-- =====================================================
      PWA Manifest
    ====================================================== -->

    <!-- <link rel="manifest" href="/manifest.webmanifest" /> -->

    <!-- 一般瀏覽器主題色 -->
    <meta name="theme-color" content="#111827" />

    <!-- =====================================================
      iOS Web App / Web Clip
    ====================================================== -->

    <!--
      讓從 iOS 主畫面開啟的網站使用獨立 App 模式。
      不會顯示 Safari 網址列與底部工具列。
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!--
      iOS 主畫面 App 顯示名稱。
      沒有設定時通常使用 title 或 manifest 內的名稱。
    -->
    <meta name="apple-mobile-web-app-title" content="My App" />

    <!--
      iOS 狀態列樣式：
      default
      black
      black-translucent

      black-translucent 會讓網頁延伸到狀態列後方，
      因此頁面必須處理 safe-area-inset-top。
    -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- 防止 iOS 自動辨識電話號碼 -->
    <meta name="format-detection" content="telephone=no" />

    <!-- =====================================================
      App Icon
    ====================================================== -->

    <!--
      iOS 會優先使用 apple-touch-icon；
      若未提供，較新的 Safari 才可能使用 Manifest 中的 icon。
    -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon-180x180.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32x32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16x16.png"
    />

    <!-- =====================================================
      iOS Portrait Splash Screens
    ====================================================== -->

    <!--
      注意：
      device-width 和 device-height 使用 CSS pixel；
      圖片本身則使用實際像素尺寸。

      例如：
      393 × 852 CSS px，DPR 3
      對應 1179 × 2556 px 圖片。
    -->

    <!-- iPhone 16 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-1320x2868.png"
      media="
        screen
        and (device-width: 440px)
        and (device-height: 956px)
        and (-webkit-device-pixel-ratio: 3)
        and (orientation: portrait)
      "
    />

    <!-- iPhone 16 Pro -->
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-1206x2622.png"
      media="
        screen
        and (device-width: 402px)
        and (device-height: 874px)
        and (-webkit-device-pixel-ratio: 3)
        and (orientation: portrait)
      "
    />

    <!--

      iPhone 15 Plus

    <!--

        and (device-height: 844px)

    <!--

      media="

        and (device-width: 375px)

        and (-webkit-device-pixel-ratio: 2)

      rel="apple-touch-startup-image"
      href="/splash/iphone-640x1136.png"
      media="
        screen
        and (device-width: 320px)
        and (device-height: 568px)
        and (-webkit-device-pixel-ratio: 2)
        and (orientation: portrait)

    />

    <style>
      :root {
        color-scheme: dark;

        --background: #111827;
        --surface: #1f2937;
        --primary: #60a5fa;
        --text: #f9fafb;
        --secondary-text: #9ca3af;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        background: var(--background);
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;

        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Segoe UI",
          sans-serif;

        color: var(--text);

        /* 避免 iOS 長按文字時意外選取 */
        -webkit-user-select: none;
        user-select: none;

        /* 改善 iOS 滾動體驗 */
        -webkit-overflow-scrolling: touch;

        /* 處理瀏海、Dynamic Island 與 Home Indicator */
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        -webkit-appearance: none;
        appearance: none;
      }

      .app {
        width: 100%;
        min-height: calc(
          100vh -
          env(safe-area-inset-top) -
          env(safe-area-inset-bottom)
        );
        min-height: calc(
          100dvh -
          env(safe-area-inset-top) -
          env(safe-area-inset-bottom)
        );

        display: flex;
        flex-direction: column;
      }

      .header {
        position: sticky;
        top: 0;
        z-index: 10;

        min-height: 56px;
        padding: 12px 20px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(17, 24, 39, 0.9);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);

        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .header-title {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }

      .main {
        width: min(100%, 720px);
        margin: 0 auto;
        padding: 32px 20px 48px;

        flex: 1;
      }

      .hero {
        padding: 32px 24px;
        text-align: center;

        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
      }

      .app-logo {
        width: 96px;
        height: 96px;
        margin: 0 auto 24px;

        display: grid;
        place-items: center;

        background: linear-gradient(135deg, #2563eb, #7c3aed);
        border-radius: 24px;

        font-size: 44px;

        box-shadow:
          0 20px 40px rgba(0, 0, 0, 0.25),
          inset 0 1px rgba(255, 255, 255, 0.2);
      }

      .hero h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.2;
      }

      .hero p {
        margin: 0;
        color: var(--secondary-text);
        font-size: 16px;
        line-height: 1.6;
      }

      .status-card {
        margin-top: 20px;
        padding: 18px 20px;

        display: flex;
        align-items: center;
        gap: 12px;

        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        flex: 0 0 auto;

        border-radius: 50%;
        background: #f59e0b;
      }

      .status-dot.is-standalone {
        background: #22c55e;
      }

      .status-content {
        min-width: 0;
      }

      .status-label {
        margin: 0 0 3px;
        font-size: 14px;
        font-weight: 600;
      }

      .status-message {
        margin: 0;
        color: var(--secondary-text);
        font-size: 13px;
        line-height: 1.5;
      }

      .install-guide {
        margin-top: 20px;
        padding: 20px;

        background: rgba(96, 165, 250, 0.08);
        border: 1px solid rgba(96, 165, 250, 0.25);
        border-radius: 16px;
      }

      .install-guide[hidden] {
        display: none;
      }

      .install-guide h2 {
        margin: 0 0 12px;
        font-size: 17px;
      }

      .install-guide ol {
        margin: 0;
        padding-left: 22px;
        color: var(--secondary-text);
        font-size: 14px;
        line-height: 1.8;
      }

      .footer {
        padding: 20px;
        padding-bottom: max(20px, env(safe-area-inset-bottom));

        color: var(--secondary-text);
        text-align: center;
        font-size: 12px;
      }

      @media (display-mode: standalone) {
        .browser-only {
          display: none;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .app-logo {
          animation: logo-enter 500ms ease-out both;
        }

        .hero h1,
        .hero p {
          animation: content-enter 500ms 120ms ease-out both;
        }
      }

      @keyframes logo-enter {
        from {
          opacity: 0;
          transform: scale(0.86);
        }

        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes content-enter {
        from {
          opacity: 0;
          transform: translateY(8px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <header class="header">
        <h1 class="header-title">My Web App</h1>
      </header>

      <main class="main">
        <section class="hero">
          <div class="app-logo" aria-hidden="true">🚀</div>

          <h1>Web Clip 範例</h1>

          <p>
            將網站加入 iPhone 主畫面後開啟，
            iOS 會使用設定好的自訂 Splash Screen。
          </p>
        </section>

        <section class="status-card" aria-live="polite">
          <div id="status-dot" class="status-dot"></div>

          <div class="status-content">
            <p class="status-label">目前啟動模式</p>
            <p id="status-message" class="status-message">
              正在檢查……
            </p>
          </div>
        </section>

        <section id="install-guide" class="install-guide">
          <h2>加入 iPhone 主畫面</h2>

          <ol>
            <li>使用 Safari 開啟這個網站。</li>
            <li>點擊 Safari 下方的「分享」按鈕。</li>
            <li>選擇「加入主畫面」。</li>
            <li>從主畫面點擊 App 圖示重新開啟。</li>
          </ol>
        </section>
      </main>

      <footer class="footer">
        iOS Web Clip Splash Screen Demo
      </footer>
    </div>

    <script>
      /**
       * 判斷目前是否以主畫面 Web App 模式執行。
       *
       * navigator.standalone：
       *   iOS Safari 專用判斷。
       *
       * display-mode: standalone：
       *   一般 PWA／現代瀏覽器判斷。
       */
      function isStandaloneMode() {
        const isIOSStandalone =
          window.navigator.standalone === true;

        const isDisplayModeStandalone =
          window.matchMedia(
            "(display-mode: standalone)"
          ).matches;

        return isIOSStandalone || isDisplayModeStandalone;
      }

      function updateLaunchStatus() {
        const standalone = isStandaloneMode();

        const statusDot =
          document.getElementById("status-dot");

        const statusMessage =
          document.getElementById("status-message");

        const installGuide =
          document.getElementById("install-guide");

        if (standalone) {
          statusDot.classList.add("is-standalone");

          statusMessage.textContent =
            "目前是從主畫面以獨立 App 模式啟動。";

          installGuide.hidden = true;
        } else {
          statusDot.classList.remove("is-standalone");

          statusMessage.textContent =
            "目前是在一般瀏覽器模式中開啟。";

          installGuide.hidden = false;
        }
      }

      updateLaunchStatus();

      /**
       * 當 display-mode 發生改變時重新判斷。
       */
      const standaloneMediaQuery =
        window.matchMedia("(display-mode: standalone)");

      standaloneMediaQuery.addEventListener?.(
        "change",
        updateLaunchStatus
      );

      /**
       * 選用：註冊 Service Worker。
       * 沒有 service-worker.js 時，請刪除此區塊。
       */
      if (
        "serviceWorker" in navigator &&
        location.protocol === "https:"
      ) {
        window.addEventListener("load", async () => {
          try {
            await navigator.serviceWorker.register(
              "/service-worker.js"
            );

            console.log("Service Worker registered.");
          } catch (error) {
            console.warn(
              "Service Worker registration failed:",
              error
            );
          }
        });
      }
    </script>
  </body>
</html>
