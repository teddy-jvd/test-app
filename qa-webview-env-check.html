<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hawkplay">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QA WebView Environment Check</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #121922;
      --panel-2: #182230;
      --line: #283645;
      --text: #eef5fb;
      --muted: #9caeba;
      --accent: #4a90e2;
      --good: #2eaf75;
      --warn: #c98a1b;
      --bad: #d85b66;
      --code: #071017;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 18px 16px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    main {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .status {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .badge {
      display: flex;
      min-height: 54px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .badge strong {
      font-size: 15px;
    }

    .badge span {
      flex: 0 0 auto;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #06110b;
      background: var(--good);
    }

    .badge.warn span {
      color: #1a1000;
      background: var(--warn);
    }

    .badge.bad span {
      color: #1a0506;
      background: var(--bad);
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 11px 12px;
      background: var(--accent);
      color: #f8fbff;
      font-size: 14px;
      font-weight: 750;
    }

    button.secondary {
      background: #3d4b59;
    }

    button.warn {
      background: #9d6a13;
    }

    section {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--panel);
    }

    section h2 {
      margin: 0;
      padding: 12px;
      font-size: 14px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--line);
    }

    dl {
      margin: 0;
      display: grid;
      grid-template-columns: minmax(120px, 32%) minmax(0, 1fr);
    }

    dt,
    dd {
      margin: 0;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      min-width: 0;
    }

    dt {
      color: var(--muted);
      font-size: 12px;
    }

    dd {
      font-size: 12px;
      line-height: 1.45;
      word-break: break-word;
      white-space: pre-wrap;
    }

    dl div:last-child dt,
    dl div:last-child dd {
      border-bottom: 0;
    }

    dl div {
      display: contents;
    }

    code,
    pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    pre {
      margin: 0;
      min-height: 150px;
      max-height: 360px;
      overflow: auto;
      padding: 12px;
      background: var(--code);
      color: #9ef29e;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (min-width: 720px) {
      header {
        padding-inline: 24px;
      }

      main {
        padding: 18px;
      }

      .status {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .toolbar {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>QA WebView Environment Check</h1>
    <p>顯示目前 userAgent、App WebView bridge、瀏覽器能力與裝置環境，用來比對 App 內載入與直接用瀏覽器開啟的差異。</p>
  </header>

  <main>
    <div class="status" id="status"></div>

    <div class="toolbar">
      <button type="button" onclick="refresh()">重新整理資訊</button>
      <button type="button" class="secondary" onclick="copyReport()">複製完整報告</button>
      <button type="button" class="warn" onclick="sendGetToken()">Bridge GET_TOKEN</button>
      <button type="button" class="secondary" onclick="clearLog()">清空 log</button>
    </div>

    <section>
      <h2>判斷結果</h2>
      <dl id="decision"></dl>
    </section>

    <section>
      <h2>User Agent</h2>
      <dl id="userAgent"></dl>
    </section>

    <section>
      <h2>Bridge / App WebView</h2>
      <dl id="bridge"></dl>
    </section>

    <section>
      <h2>Browser / Runtime</h2>
      <dl id="runtime"></dl>
    </section>

    <section>
      <h2>Viewport / Screen</h2>
      <dl id="viewport"></dl>
    </section>

    <section>
      <h2>Log</h2>
      <pre id="log"></pre>
    </section>
  </main>

  <script>
    var report = {};
    var logEl = document.getElementById('log');

    function bool(value) {
      return value ? 'true' : 'false';
    }

    function safeRead(label, getter) {
      try {
        return getter();
      } catch (error) {
        return label + ' error: ' + (error && error.message ? error.message : String(error));
      }
    }

    function matchesDisplayMode(mode) {
      return safeRead('matchMedia', function() {
        return window.matchMedia && window.matchMedia('(display-mode: ' + mode + ')').matches;
      }) || false;
    }

    function detectJvdUserAgent(ua) {
      var match = ua.match(/JVDApp\s+(iOS|Android)\s+([^\s]+)\s+wv/i);
      return match ? {
        matched: true,
        platform: match[1],
        appVersion: match[2]
      } : {
        matched: false,
        platform: '',
        appVersion: ''
      };
    }

    function collectReport() {
      var nav = window.navigator || {};
      var ua = nav.userAgent || '';
      var jvd = detectJvdUserAgent(ua);
      var hasReactNativeWebView = !!window.ReactNativeWebView;
      var hasReactNativeBridge = !!window.ReactNativeBridge;
      var hasNativeBridgeFlag = !!(window.ReactNativeBridge && window.ReactNativeBridge._isNativeBridge);
      var hasJsBridge = !!(window.jsBridge && typeof window.jsBridge.postMessage === 'function');
      var hasWebkitBridge = !!(
        window.webkit &&
        window.webkit.messageHandlers &&
        window.webkit.messageHandlers.jsBridge &&
        typeof window.webkit.messageHandlers.jsBridge.postMessage === 'function'
      );
      var androidWvToken = /;\s*wv\)/i.test(ua) || /\bVersion\/[\d.]+ Chrome\/[\d.]+ Mobile Safari\/[\d.]+$/i.test(ua);
      var likelyAppWebView = hasNativeBridgeFlag || hasReactNativeWebView || jvd.matched;
      var likelyBrowser = !likelyAppWebView;

      return {
        decision: {
          likelyAppWebView: likelyAppWebView,
          likelyBrowser: likelyBrowser,
          reason: [
            hasNativeBridgeFlag ? 'ReactNativeBridge._isNativeBridge=true' : '',
            hasReactNativeWebView ? 'window.ReactNativeWebView exists' : '',
            jvd.matched ? 'userAgent contains JVDApp suffix' : '',
            !likelyAppWebView ? 'no app bridge or JVDApp userAgent suffix detected' : ''
          ].filter(Boolean).join(', '),
          note: 'UA 可被偽造；bridge 受注入時機影響。此頁適合 QA 分流檢查，不應作為安全驗證。'
        },
        userAgent: {
          userAgent: ua,
          appCodeName: nav.appCodeName || '',
          appName: nav.appName || '',
          appVersion: nav.appVersion || '',
          platform: nav.platform || '',
          product: nav.product || '',
          vendor: nav.vendor || '',
          jvdAppUaMatched: jvd.matched,
          jvdPlatform: jvd.platform,
          jvdAppVersion: jvd.appVersion,
          androidWebViewTokenDetected: androidWvToken
        },
        bridge: {
          ReactNativeWebView: hasReactNativeWebView,
          ReactNativeBridge: hasReactNativeBridge,
          ReactNativeBridge_isNativeBridge: hasNativeBridgeFlag,
          ReactNativeBridge_hasPostMessage: !!(window.ReactNativeBridge && typeof window.ReactNativeBridge.postMessage === 'function'),
          ReactNativeBridge_hasOn: !!(window.ReactNativeBridge && typeof window.ReactNativeBridge.on === 'function'),
          jsBridge: hasJsBridge,
          webkitMessageHandlersJsBridge: hasWebkitBridge
        },
        runtime: {
          url: location.href,
          origin: location.origin,
          referrer: document.referrer || '',
          title: document.title,
          language: nav.language || '',
          languages: safeRead('languages', function() { return Array.prototype.slice.call(nav.languages || []); }),
          cookieEnabled: !!nav.cookieEnabled,
          cookie: safeRead('cookie', function() { return document.cookie || ''; }),
          localStorage: safeRead('localStorage', function() {
            var key = '__qa_env_check__';
            localStorage.setItem(key, String(Date.now()));
            var value = localStorage.getItem(key);
            localStorage.removeItem(key);
            return value ? 'available' : 'unavailable';
          }),
          sessionStorage: safeRead('sessionStorage', function() {
            var key = '__qa_env_check__';
            sessionStorage.setItem(key, String(Date.now()));
            var value = sessionStorage.getItem(key);
            sessionStorage.removeItem(key);
            return value ? 'available' : 'unavailable';
          }),
          onLine: !!nav.onLine,
          doNotTrack: nav.doNotTrack || window.doNotTrack || '',
          maxTouchPoints: nav.maxTouchPoints || 0,
          hardwareConcurrency: nav.hardwareConcurrency || '',
          deviceMemory: nav.deviceMemory || '',
          timezone: safeRead('timezone', function() { return Intl.DateTimeFormat().resolvedOptions().timeZone; }),
          timezoneOffsetMinutes: new Date().getTimezoneOffset(),
          standaloneNavigator: !!nav.standalone,
          displayModeStandalone: matchesDisplayMode('standalone'),
          displayModeFullscreen: matchesDisplayMode('fullscreen'),
          displayModeMinimalUi: matchesDisplayMode('minimal-ui'),
          displayModeBrowser: matchesDisplayMode('browser')
        },
        viewport: {
          innerWidth: window.innerWidth,
          innerHeight: window.innerHeight,
          outerWidth: window.outerWidth,
          outerHeight: window.outerHeight,
          visualViewportWidth: window.visualViewport ? window.visualViewport.width : '',
          visualViewportHeight: window.visualViewport ? window.visualViewport.height : '',
          devicePixelRatio: window.devicePixelRatio,
          screenWidth: window.screen ? window.screen.width : '',
          screenHeight: window.screen ? window.screen.height : '',
          screenAvailWidth: window.screen ? window.screen.availWidth : '',
          screenAvailHeight: window.screen ? window.screen.availHeight : '',
          screenColorDepth: window.screen ? window.screen.colorDepth : '',
          orientationType: window.screen && window.screen.orientation ? window.screen.orientation.type : '',
          orientationAngle: window.screen && window.screen.orientation ? window.screen.orientation.angle : ''
        }
      };
    }

    function renderDl(id, data) {
      var el = document.getElementById(id);
      el.innerHTML = Object.keys(data).map(function(key) {
        var value = data[key];
        if (Array.isArray(value) || (value && typeof value === 'object')) {
          value = JSON.stringify(value, null, 2);
        }
        return '<div><dt>' + escapeHtml(key) + '</dt><dd>' + escapeHtml(String(value)) + '</dd></div>';
      }).join('');
    }

    function renderStatus(data) {
      var items = [
        {
          label: 'App WebView',
          value: data.decision.likelyAppWebView ? 'YES' : 'NO',
          className: data.decision.likelyAppWebView ? '' : 'bad'
        },
        {
          label: 'JVDApp UA',
          value: data.userAgent.jvdAppUaMatched ? 'YES' : 'NO',
          className: data.userAgent.jvdAppUaMatched ? '' : 'warn'
        },
        {
          label: 'Native Bridge',
          value: data.bridge.ReactNativeBridge_isNativeBridge ? 'READY' : 'MISSING',
          className: data.bridge.ReactNativeBridge_isNativeBridge ? '' : 'warn'
        }
      ];
      document.getElementById('status').innerHTML = items.map(function(item) {
        return '<div class="badge ' + item.className + '"><strong>' + escapeHtml(item.label) + '</strong><span>' + escapeHtml(item.value) + '</span></div>';
      }).join('');
    }

    function refresh() {
      report = collectReport();
      renderStatus(report);
      renderDl('decision', report.decision);
      renderDl('userAgent', report.userAgent);
      renderDl('bridge', report.bridge);
      renderDl('runtime', report.runtime);
      renderDl('viewport', report.viewport);
      log('refreshed');
    }

    function copyReport() {
      var text = JSON.stringify(report, null, 2);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(function() { log('report copied to clipboard'); })
          .catch(function(error) { log('clipboard failed: ' + error.message); });
      } else {
        log('clipboard API unavailable\n' + text);
      }
    }

    function sendGetToken() {
      if (!window.ReactNativeBridge || typeof window.ReactNativeBridge.postMessage !== 'function') {
        log('ReactNativeBridge missing; cannot send GET_TOKEN');
        return;
      }
      window.ReactNativeBridge.postMessage('GET_TOKEN', null);
      log('sent GET_TOKEN');
    }

    function setupBridgeListeners() {
      if (!window.ReactNativeBridge || typeof window.ReactNativeBridge.on !== 'function') {
        refresh();
        log('ReactNativeBridge not ready yet');
        return;
      }
      window.ReactNativeBridge.on('TOKEN_RESPONSE', function(payload) {
        log('TOKEN_RESPONSE received\n' + JSON.stringify(payload, null, 2));
        refresh();
      });
      window.ReactNativeBridge.on('PUSH_NOTIFICATION', function(payload) {
        log('PUSH_NOTIFICATION received\n' + JSON.stringify(payload, null, 2));
      });
      window.ReactNativeBridge.on('DEEP_LINK', function(payload) {
        log('DEEP_LINK received\n' + JSON.stringify(payload, null, 2));
      });
      refresh();
      log('ReactNativeBridge ready');
    }

    function clearLog() {
      logEl.textContent = '';
    }

    function log(message) {
      var line = '[' + new Date().toLocaleTimeString() + '] ' + message;
      logEl.textContent = line + '\n\n' + logEl.textContent;
    }

    function escapeHtml(value) {
      return value
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.addEventListener('ReactNativeBridgeReady', setupBridgeListeners);
    window.addEventListener('resize', refresh);
    window.addEventListener('orientationchange', function() {
      setTimeout(refresh, 250);
    });

    refresh();
    setTimeout(setupBridgeListeners, 300);
    setTimeout(refresh, 1200);
  </script>
</body>
</html>
